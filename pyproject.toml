[project]
name = "pragma"
version = "0.9.0"
description = "PRAGMA reference implementation — SOL 021 V5.4.1 conformant intent management API + extensions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pragma"]

[tool.pytest.ini_options]
testpaths = ["tests"]